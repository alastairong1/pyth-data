version: "3.9"
services:
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - /mnt/volume_nyc3_01:/data
    healthcheck:
      test: ["CMD", "bash", "-lc", "test -f /data/metrics.db && echo ok"]
      interval: 30s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL: "frser-sqlite-datasource"
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-admin123}"
    volumes:
      - grafana-storage:/var/lib/grafana
      - data:/data:ro

volumes:
  data:
  grafana-storage:
