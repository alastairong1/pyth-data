version: "3.9"
services:
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - /mnt/volume_nyc3_01:/data
    healthcheck:
      test: ["CMD", "bash", "-lc", "test -f /data/metrics.db && echo ok"]
      interval: 30s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_PLUGINS_PREINSTALL: "frser-sqlite-datasource"
      GF_SERVER_ROOT_URL: "https://ops.st0x.io"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - grafana-storage:/var/lib/grafana
      - /mnt/volume_nyc3_01:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      grafana:
        condition: service_started
      certbot:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./certbot-entrypoint.sh:/entrypoint.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /entrypoint.sh
    environment:
      CERTBOT_EMAIL: "${CERTBOT_EMAIL:alastair@st0x.io}"
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/letsencrypt/live/ops.st0x.io/fullchain.pem"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  grafana-storage:
  letsencrypt:
  certbot-www:
