version: "3.9"
services:
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - /mnt/volume_nyc3_01:/data
    healthcheck:
      test: ["CMD", "bash", "-lc", "test -f /data/metrics.db && echo ok"]
      interval: 30s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_PLUGINS_PREINSTALL: "frser-sqlite-datasource"
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-admin123}"
      GF_SERVER_ROOT_URL: "https://ops.st0x.io"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - grafana-storage:/var/lib/grafana
      - /mnt/volume_nyc3_01:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - grafana

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "certbot renew --quiet && trap exit TERM; while :; do sleep 12h & wait $$!; certbot renew --quiet; done"
    depends_on:
      - nginx

volumes:
  grafana-storage:
  letsencrypt:
  certbot-www:
